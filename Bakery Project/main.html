<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetooth Bakery Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAIN DISPLAY BOX -->
    <div class="shop-container">
        
        <!-- BACKDROP: 3 ARCHED WINDOWS -->
        <div class="window-backdrop">
            <div class="arch-window"></div>
            
            <!-- CENTER ARCH WITH WEBSITE LOGO -->
            <div class="arch-window center-arch">
                <div class="branding-header">
                    <h1 class="logo-title">SweeTooth</h1>
                    <p class="tagline">Craving Sweet ?<br>We Too</p>
                    <div class="heart-icon">♥</div>
                </div>
            </div>
            
            <div class="arch-window"></div>
        </div>

        <!-- SIDE NAVIGATION BUTTONS (UI CAROUSEL EFFECT) -->
        <button class="nav-arrow left-arrow">&#10094;</button>
        <button class="nav-arrow right-arrow">&#10095;</button>

        <!-- MIDDLE LAYER: COUNTER AND BAKERY DISPLAYS -->
        <div class="counter-layer">
            <!-- Left Glass Display Case -->
            <div class="pastry-case">
                <div class="glass-shelf"></div>
                <div class="glass-shelf"></div>
            </div>
            
            <!-- Main Serving Table -->
            <div class="main-counter">
                <!-- You can append your bread/jar element classes here -->
                <div class="counter-top-items"></div>
            </div>
        </div>

        <!-- BOTTOM LAYER: COFFEE BAGS & PLUSHIES CABINET -->
        <div class="bottom-cabinet">
            <div class="cabinet-grid">
                <div class="grid-cell plushie-section"></div>
                <div class="grid-cell coffee-section"></div>
                <div class="grid-cell storage-section"></div>
            </div>
        </div>

    </div>

</body>
</html>
